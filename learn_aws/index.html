<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS はじめてラボ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --bg: #f7fbff;
  --ink: #11243a;
  --muted: #577087;
  --accent: #ff9900;
  --accent-deep: #dd8400;
  --surface: #ffffff;
  --ok: #157347;
  --bad: #b42318;
  --border: #dbe7f2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Zen Kaku Gothic New", sans-serif;
  background: radial-gradient(circle at top right, #e8f4ff, var(--bg) 45%);
  color: var(--ink);
  line-height: 1.6;
}

.hero {
  padding: 56px 20px 40px;
}

.hero__inner {
  max-width: 820px;
  margin: 0 auto;
  background: linear-gradient(135deg, #0e2440, #1f4c7d);
  color: #f5f9ff;
  border-radius: 20px;
  padding: 34px;
  box-shadow: 0 16px 32px rgba(16, 44, 73, 0.28);
  animation: fadeUp 0.7s ease;
}

.hero__eyebrow {
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.8;
  font-size: 0.82rem;
}

.hero__topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.lang-switch {
  display: inline-flex;
  gap: 6px;
  padding: 4px;
  border-radius: 999px;
  border: 1px solid rgba(200, 223, 243, 0.44);
  background: rgba(255, 255, 255, 0.14);
}

.lang-switch__btn {
  border: 0;
  border-radius: 999px;
  padding: 6px 12px;
  background: transparent;
  color: #f0f7ff;
  font: inherit;
  font-size: 0.86rem;
  cursor: pointer;
}

.lang-switch__btn.is-active {
  background: #f1f8ff;
  color: #11345a;
  font-weight: 700;
}

h1 {
  margin: 8px 0 10px;
  font-size: clamp(1.9rem, 3vw, 2.6rem);
}

.container {
  max-width: 860px;
  margin: 0 auto 60px;
  padding: 0 20px;
}

.progress-panel {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 16px;
}

.progress-panel > div {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
}

.label {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 20px rgba(33, 79, 122, 0.08);
}

.card h2,
.card h3 {
  margin-top: 0;
}

.mini-glossary {
  margin-bottom: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #c9def0;
  background: #f6fbff;
}

.mini-glossary__title {
  margin: 0 0 6px;
  color: #18486e;
  font-size: 0.84rem;
  font-weight: 700;
}

.mini-glossary ul {
  margin: 0;
  padding-left: 18px;
}

.mini-glossary li {
  margin-bottom: 4px;
  font-size: 0.9rem;
  color: #29485f;
}

.hint {
  margin-top: 0;
  color: #1b4e79;
  font-weight: 700;
}

.option-list {
  display: grid;
  gap: 10px;
}

.option-btn {
  border: 1px solid #c7daea;
  border-radius: 12px;
  background: #f7fbff;
  color: var(--ink);
  text-align: left;
  padding: 12px;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
}

.option-btn:hover {
  transform: translateY(-1px);
  border-color: #7ea9ce;
}

.option-btn:disabled {
  cursor: default;
}

.option-btn.correct {
  border-color: #76c893;
  background: #ebf9ef;
}

.option-btn.wrong {
  border-color: #ef9a9a;
  background: #fff0f0;
}

.feedback {
  margin-top: 14px;
  font-weight: 700;
}

.feedback.ok {
  color: var(--ok);
}

.feedback.bad {
  color: var(--bad);
}

.actions {
  display: flex;
  gap: 10px;
}

.btn {
  border: 0;
  border-radius: 12px;
  padding: 10px 16px;
  font: inherit;
  cursor: pointer;
  background: #12395f;
  color: #fff;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--accent);
  color: #1f1100;
}

.btn--primary:hover {
  background: var(--accent-deep);
}

.btn--ghost {
  background: #edf4fb;
  color: #103354;
  border: 1px solid #cadef0;
}

.visual-card {
  margin: 18px 0;
  padding: 16px;
  border-radius: 12px;
  background: #f0f7fc;
  border: 1px solid #cce3f5;
}

.visual-card__header {
  margin-bottom: 12px;
}

.visual-card__title {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 700;
  color: #0f3558;
}

.visual-card__caption {
  margin: 2px 0 0;
  font-size: 0.82rem;
  color: #486581;
}

.visual-card__content {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

@media (min-width: 620px) {
  .visual-card__content {
    flex-direction: row;
    align-items: center;
  }
}

.visual-card__diagram {
  flex: 1.1;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  border: 1px solid #d4e5f7;
  border-radius: 8px;
  padding: 12px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
}

.visual-card__diagram svg {
  max-width: 100%;
  height: auto;
  display: block;
}

.visual-card__diagram img {
  max-width: 100%;
  height: auto;
  border-radius: 6px;
}

.visual-card__points {
  flex: 0.9;
  margin: 0;
  padding-left: 20px;
  font-size: 0.88rem;
  color: #214360;
}

.visual-card__points li {
  margin-bottom: 6px;
}

.visual-card__source {
  margin: 10px 0 0;
  font-size: 0.76rem;
  color: #627d98;
  text-align: right;
}

.visual-card__source a {
  color: #1b4e79;
  text-decoration: underline;
  word-break: break-all;
}

.step-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 12px rgba(33, 79, 122, 0.05);
}

.step-nav__label {
  font-size: 0.88rem;
  font-weight: 700;
  color: #18486e;
  white-space: nowrap;
}

.step-nav__select {
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #c7daea;
  background: #f7fbff;
  color: var(--ink);
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.step-nav__select:focus,
.step-nav__select:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.15);
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 640px) {
  .hero__inner,
  .card {
    padding: 16px;
  }

  .hero__topbar {
    flex-direction: column;
    align-items: flex-start;
  }

  .progress-panel {
    grid-template-columns: 1fr;
  }
}
</style>
  </head>
  <body>
    <header class="hero">
      <div class="hero__inner">
        <div class="hero__topbar">
          <p class="hero__eyebrow" id="heroEyebrow">AWS Beginner Interactive Course</p>
          <div class="lang-switch" role="group" aria-label="Language switcher">
            <button id="langJaBtn" class="lang-switch__btn is-active" type="button">日本語</button>
            <button id="langEnBtn" class="lang-switch__btn" type="button">English</button>
          </div>
        </div>
        <h1 id="heroTitle">AWS はじめてラボ</h1>
        <p id="heroDescription">
          AWSをこれから学ぶ人向けのインタラクティブ授業です。先生の解説を読み、
          一緒に選択式クイズを解きながら進めましょう。
        </p>
        <button id="startBtn" class="btn btn--primary">学習を始める</button>
      </div>
    </header>

    <main class="container" id="app" hidden>
      <section class="progress-panel" id="progressPanel" aria-label="進捗">
        <div>
          <p class="label" id="progressLabel">進捗</p>
          <p id="progressText">1 / 15</p>
        </div>
        <div>
          <p class="label" id="scoreLabel">スコア</p>
          <p><span id="scoreText">0</span> <span id="scoreUnit">点</span></p>
        </div>
      </section>

      <section class="step-nav" aria-label="問題移動">
        <label for="stepSelect" class="step-nav__label" id="stepSelectLabel">問題を選択:</label>
        <select id="stepSelect" class="step-nav__select" aria-label="問題・Step選択"></select>
      </section>

      <section class="card" id="lessonCard" aria-live="polite"></section>

      <section class="card" id="quizCard" aria-live="polite"></section>

      <section class="actions">
        <button id="backBtn" class="btn btn--ghost" disabled>戻る</button>
        <button id="nextBtn" class="btn" disabled>次へ</button>
        <button id="restartBtn" class="btn btn--ghost" hidden>最初からやり直す</button>
      </section>
    </main>

    <template id="optionTemplate">
      <button class="option-btn" type="button"></button>
    </template>

    <script>
const lessons = [
  {
    topic: "導入: クラウドとは何か",
    minutes: 5,
    body: "クラウドとは、インターネット経由でサーバーやストレージ、データベースなどのIT資源を利用する考え方です。自分で物理サーバーを買わなくても、必要なときに必要な分だけ使えます。",
    detail:
      "従来は、サービス公開前に機器の購入、設置、電源・空調、故障対応まで準備が必要でした。クラウドではこれらの多くを事業者が担うため、学習者や開発チームはアプリ開発に集中しやすくなります。",
    visual: {
      title: "イメージ図: クラウド利用の流れ",
      caption: "『必要な時だけ借りる』オンデマンド利用",
      points: [
        "1) Web画面やAPIからサービスを選択",
        "2) 数分でサーバーやストレージを起動",
        "3) 使った分だけ従量課金で支払い"
      ],
      svg: `<svg viewBox="0 0 300 140" width="100%" height="130" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="45" width="55" height="38" rx="5" fill="#0e2440"/>
        <rect x="20" y="50" width="45" height="25" rx="3" fill="#205493"/>
        <path d="M 32 83 L 53 83 L 58 92 L 27 92 Z" fill="#0e2440"/>
        <text x="42" y="108" font-size="9" text-anchor="middle" fill="#11243a" font-weight="bold">PC / スマホ</text>
        <path d="M 80 64 L 115 64" stroke="#ff9900" stroke-width="3" stroke-dasharray="3 2"/>
        <polygon points="115,60 123,64 115,68" fill="#ff9900"/>
        <text x="100" y="56" font-size="8" text-anchor="middle" fill="#dd8400" font-weight="bold">Internet</text>
        <path d="M 135 65 C 135 45, 155 35, 175 40 C 185 30, 215 30, 225 45 C 240 45, 250 58, 245 75 C 255 88, 240 105, 225 105 C 210 105, 135 105, 135 65 Z" fill="#e8f4ff" stroke="#205493" stroke-width="2"/>
        <rect x="155" y="52" width="32" height="18" rx="3" fill="#ff9900"/>
        <text x="171" y="64" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="bold">EC2</text>
        <rect x="195" y="52" width="32" height="18" rx="3" fill="#205493"/>
        <text x="211" y="64" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="bold">S3</text>
        <rect x="175" y="75" width="32" height="18" rx="3" fill="#157347"/>
        <text x="191" y="87" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="bold">RDS</text>
        <text x="190" y="122" font-size="9" text-anchor="middle" fill="#11243a" font-weight="bold">AWS Cloud (オンデマンド)</text>
      </svg>`,
      sourceUrl: "https://aws.amazon.com/jp/what-is-cloud-computing/"
    },
    teacherNote:
      "先生: 学校の図書館をイメージしてください。自分で本棚を全部買う代わりに、必要な本を借りる感覚に近いです。",
    hint: "ヒント: 初期費用と使う量に注目して選びましょう。",
    quiz: {
      question: "クラウドの説明として最も適切なのはどれ？",
      options: [
        "自宅にしか置けない物理機器のこと",
        "ネット経由でIT資源を必要に応じて使う仕組み",
        "USBメモリだけで構築する仕組み",
        "1回買ったら永続無料で使える仕組み"
      ],
      answerIndex: 1,
      explanation: "クラウドはネット経由でITリソースを柔軟に利用する形です。"
    }
  },
  {
    topic: "オンプレミスとの違い",
    minutes: 5,
    body: "オンプレミスは自社でサーバーを購入・設置・保守します。クラウドはその多くをサービスとして利用できます。速度面や管理ポリシーの要件によって使い分けます。",
    detail:
      "オンプレミスは自由度が高い一方、調達期間や保守体制の準備が必要です。クラウドは短期間で始めやすい反面、サービス仕様や責任分界を理解して運用することが重要になります。",
    visual: {
      title: "イメージ図: オンプレミス vs クラウド",
      caption: "『所有』から『利用』へのシフト",
      points: [
        "オンプレ: 自社で物理機器を購入・設置・24時間保守",
        "クラウド: 事業者の基盤をブラウザ経由で必要な分だけ利用",
        "責任範囲: インフラ物理管理はクラウド事業者に委任"
      ],
      svg: `<svg viewBox="0 0 300 140" width="100%" height="130" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="20" width="125" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="77" y="38" font-size="10" text-anchor="middle" fill="#334155" font-weight="bold">オンプレミス (自社所有)</text>
        <rect x="35" y="48" width="85" height="16" rx="3" fill="#64748b"/>
        <text x="77" y="60" font-size="8" text-anchor="middle" fill="#ffffff">自社サーバー室・物理機器</text>
        <rect x="35" y="68" width="85" height="16" rx="3" fill="#64748b"/>
        <text x="77" y="80" font-size="8" text-anchor="middle" fill="#ffffff">電源・空調・故障対応</text>
        <text x="77" y="105" font-size="8" text-anchor="middle" fill="#b42318" font-weight="bold">⚠️ 初期費用高・調達に数か月</text>
        
        <rect x="160" y="20" width="125" height="100" rx="8" fill="#e8f4ff" stroke="#205493" stroke-width="1.5"/>
        <text x="222" y="38" font-size="10" text-anchor="middle" fill="#0e2440" font-weight="bold">AWSクラウド (サービス利用)</text>
        <rect x="180" y="48" width="85" height="16" rx="3" fill="#ff9900"/>
        <text x="222" y="60" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="bold">数分で環境作成</text>
        <rect x="180" y="68" width="85" height="16" rx="3" fill="#205493"/>
        <text x="222" y="80" font-size="8" text-anchor="middle" fill="#ffffff">インフラ管理はAWS任せ</text>
        <text x="222" y="105" font-size="8" text-anchor="middle" fill="#157347" font-weight="bold">✨ 初期費用0円・使った分だけ</text>
      </svg>`,
      sourceUrl: "https://aws.amazon.com/jp/cloud-computing/"
    },
    teacherNote:
      "先生: オンプレは『自社所有』、クラウドは『サービス利用』が大きな違いです。運用責任の範囲も変わります。",
    hint: "ヒント: 機器の購入とメンテナンスが必要かどうかを考えましょう。",
    quiz: {
      question: "オンプレミスの特徴として正しいものは？",
      options: [
        "機器の保守をクラウド事業者に完全委任する",
        "自社で機器調達や保守運用を行う",
        "従量課金しか選べない",
        "リージョンを選べない"
      ],
      answerIndex: 1,
      explanation: "オンプレミスは自社資産として機器管理を行います。"
    }
  },
  {
    topic: "クラウドの代表的な利点",
    minutes: 5,
    body: "クラウドの利点は、初期投資を抑えられること、短時間で環境を用意できること、需要に応じてスケールできることです。",
    detail:
      "たとえばキャンペーンでアクセスが急増した場合、事前に数か月かけて機器調達をしなくても、クラウドなら設定変更で増強できます。学習段階でも小規模に始めて徐々に拡張できるため、失敗コストを下げやすいです。",
    visual: {
      title: "イメージ図: 弾力性（スケール）の考え方",
      caption: "アクセス需要の変動に合わせて自動で増減",
      points: [
        "通常時: 少ないサーバー台数でコスト最小化",
        "アクセス急増時: スペック増強や台数を即座に自動追加",
        "ピーク終了時: 自動で縮小して無駄な費用をカット"
      ],
      svg: `<svg viewBox="0 0 300 140" width="100%" height="130" xmlns="http://www.w3.org/2000/svg">
        <path d="M 30 100 Q 80 100 120 40 Q 160 40 200 100 T 270 100" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="150" y="25" font-size="9" text-anchor="middle" fill="#dd8400" font-weight="bold">アクセス急増 (ピーク時)</text>
        
        <rect x="35" y="75" width="30" height="18" rx="3" fill="#205493"/>
        <text x="50" y="87" font-size="8" text-anchor="middle" fill="#ffffff">1台</text>
        <text x="50" y="112" font-size="8" text-anchor="middle" fill="#577087">通常時</text>

        <rect x="110" y="45" width="26" height="15" rx="3" fill="#ff9900"/>
        <rect x="140" y="45" width="26" height="15" rx="3" fill="#ff9900"/>
        <rect x="170" y="45" width="26" height="15" rx="3" fill="#ff9900"/>

        <rect x="235" y="75" width="30" height="18" rx="3" fill="#205493"/>
        <text x="250" y="87" font-size="8" text-anchor="middle" fill="#ffffff">1台</text>
        <text x="250" y="112" font-size="8" text-anchor="middle" fill="#577087">自動縮小</text>
      </svg>`,
      sourceUrl: "https://aws.amazon.com/jp/what-is-cloud-computing/"
    },
    teacherNote:
      "先生: たとえばアクセスが急増したとき、クラウドならサーバー台数を増やしやすいです。",
    hint: "ヒント: 柔軟性とスピードに着目しましょう。",
    quiz: {
      question: "クラウドの利点として不適切なのはどれ？",
      options: [
        "短時間で環境を作れる",
        "需要に合わせて拡張できる",
        "使わない期間のコスト最適化がしやすい",
        "絶対に障害が発生しない"
      ],
      answerIndex: 3,
      explanation: "クラウドでも障害は起こり得るため、設計で備えます。"
    }
  },
  {
    topic: "クラウドの注意点",
    minutes: 5,
    body: "便利な一方で、設定ミスによる情報公開、停止忘れによるコスト増、責任分界の理解不足がトラブルにつながります。",
    detail:
      "クラウドでは『速く作れる』ことが強みですが、確認不足のまま公開すると事故が起きやすくなります。作成時にセキュリティ設定をテンプレート化し、運用時は監視とアラートを組み合わせるのが実務での基本です。",
    visual: {
      title: "イメージ図: 安全運用の3ステップガードレール",
      caption: "スピードと安全性を両立する設計サイクル",
      points: [
        "設計: 最小権限と公開範囲（パブリック/プライベート）を定義",
        "実装: セキュアな設定テンプレート（IaC）で構築を自動化",
        "運用: CloudWatch監視とコストアラートで異常を即検知"

      explanation: "Savings Plans discounts plus S3 Glacier lifecycle transitions reduce costs safely without impacting performance."
    }
  }
];

const uiText = {
  ja: {
    documentTitle: "AWS はじめてラボ",
    heroEyebrow: "AWS Beginner Interactive Course",
    heroTitle: "AWS はじめてラボ",
    heroDescription:
      "AWSをこれから学ぶ人向けのインタラクティブ授業です。先生の解説を読み、一緒に選択式クイズを解きながら進めましょう。",
    start: "学習を始める",
    progressPanelAria: "進捗",
    progressLabel: "進捗",
    scoreLabel: "スコア",
    scoreUnit: "点",
    back: "戻る",
    next: "次へ",
    viewResult: "結果を見る",
    restart: "最初からやり直す",
    stepPrefix: "Step",
    estimateLabel: "このパートの目安",
    minutesUnit: "分",
    approxPrefix: "約",
    glossaryAria: "用語ミニ解説",
    glossaryTitle: "用語ミニ解説",
    quizHeading: "一緒に解くチェック問題",
    correctPrefix: "正解！ 先生の解説:",
    wrongPrefix: "不正解。先生の解説:",
    classDone: "授業完了",
    classDoneBody: "授業（合計 約{total}分）を完了しました。お疲れさまでした。",
    finalResult: "最終結果",
    yourScore: "あなたのスコア",
    progressDone: "{current} / {total}",
    progressDuring: "{current} / {total} (約{done}/{all}分)",
    stepSelectLabel: "問題を選択:"
  },
  en: {
    documentTitle: "AWS Beginner Lab",
    heroEyebrow: "AWS Beginner Interactive Course",
    heroTitle: "AWS Beginner Lab",
    heroDescription:
      "An interactive lesson for first-time AWS learners. Read the instructor guidance and answer quiz questions step by step.",
    start: "Start Learning",
    progressPanelAria: "Progress",
    progressLabel: "Progress",
    scoreLabel: "Score",
    scoreUnit: "pts",
    back: "Back",
    next: "Next",
    viewResult: "View Result",
    restart: "Restart from Beginning",
    stepPrefix: "Step",
    estimateLabel: "Estimated time",
    minutesUnit: "min",
    approxPrefix: "~",
    glossaryAria: "Mini glossary",
    glossaryTitle: "Mini glossary",
    quizHeading: "Practice Checkpoint",
    correctPrefix: "Correct! Instructor note:",
    wrongPrefix: "Not quite. Instructor note:",
    classDone: "Lesson Complete",
    classDoneBody: "You completed the lesson (total: ~{total} min). Great work.",
    finalResult: "Final Result",
    yourScore: "Your score",
    progressDone: "{current} / {total}",
    progressDuring: "{current} / {total} (~{done}/{all} min)",
    stepSelectLabel: "Select Step:"
  }
};

const startBtn = document.querySelector("#startBtn");
const app = document.querySelector("#app");
const lessonCard = document.querySelector("#lessonCard");
const quizCard = document.querySelector("#quizCard");
const backBtn = document.querySelector("#backBtn");
const nextBtn = document.querySelector("#nextBtn");
const restartBtn = document.querySelector("#restartBtn");
const progressText = document.querySelector("#progressText");
const scoreText = document.querySelector("#scoreText");
const scoreUnit = document.querySelector("#scoreUnit");
const optionTemplate = document.querySelector("#optionTemplate");
const heroEyebrow = document.querySelector("#heroEyebrow");
const heroTitle = document.querySelector("#heroTitle");
const heroDescription = document.querySelector("#heroDescription");
const progressPanel = document.querySelector("#progressPanel");
const progressLabel = document.querySelector("#progressLabel");
const scoreLabel = document.querySelector("#scoreLabel");
const langJaBtn = document.querySelector("#langJaBtn");
const langEnBtn = document.querySelector("#langEnBtn");
const stepSelect = document.querySelector("#stepSelect");
const stepSelectLabel = document.querySelector("#stepSelectLabel");

stepSelect.addEventListener("change", (e) => {
  current = parseInt(e.target.value, 10);
  showingResult = false;
  render();
});

startBtn.addEventListener("click", () => {
  app.hidden = false;
  startBtn.hidden = true;
  showingResult = false;
  render();
});

nextBtn.addEventListener("click", () => {
  const activeLessons = getLessons();
  if (!answered) {
    return;
  }

  if (current === activeLessons.length - 1) {
    renderResult();
    return;
  }

  current += 1;
  render();
});

backBtn.addEventListener("click", () => {
  if (current === 0) {
    return;
  }

  current -= 1;
  render();
});

restartBtn.addEventListener("click", () => {
  current = 0;
  selectedAnswers.fill(null);
  updateScore();
  showingResult = false;
  nextBtn.hidden = false;
  restartBtn.hidden = true;
  render();
});

langJaBtn.addEventListener("click", () => setLanguage("ja"));
langEnBtn.addEventListener("click", () => setLanguage("en"));

applyLanguageUI();

function render() {
  const text = uiText[lang];
  const activeLessons = getLessons();
  const lesson = activeLessons[current];
  answered = selectedAnswers[current] !== null;
  showingResult = false;

  const totalMinutes = activeLessons.reduce((sum, item) => sum + item.minutes, 0);
  const doneMinutes = activeLessons
    .slice(0, current + 1)
    .reduce((sum, item) => sum + item.minutes, 0);

  nextBtn.hidden = false;
  restartBtn.hidden = true;
  backBtn.disabled = current === 0;
  progressText.textContent = text.progressDuring
    .replace("{current}", String(current + 1))
    .replace("{total}", String(activeLessons.length))
    .replace("{done}", String(doneMinutes))
    .replace("{all}", String(totalMinutes));
  scoreText.textContent = String(score);
  scoreUnit.textContent = text.scoreUnit;
  nextBtn.disabled = !answered;
  backBtn.textContent = text.back;
  restartBtn.textContent = text.restart;
  nextBtn.textContent = current === activeLessons.length - 1 ? text.viewResult : text.next;
  stepSelect.value = String(current);

  const visualHtml = lesson.visual
    ? `
      <section class="visual-card" aria-label="${lesson.visual.title}">
        <div class="visual-card__header">
          <h4 class="visual-card__title">📊 ${lesson.visual.title}</h4>
          ${lesson.visual.caption ? `<p class="visual-card__caption">${lesson.visual.caption}</p>` : ""}
        </div>
        <div class="visual-card__content">
          ${
            lesson.visual.svg
              ? `<div class="visual-card__diagram">${lesson.visual.svg}</div>`
              : lesson.visual.image
              ? `<div class="visual-card__diagram"><img src="${lesson.visual.image}" alt="${lesson.visual.title}" /></div>`
              : ""
          }
          ${
            lesson.visual.points
              ? `
                <ul class="visual-card__points">
                  ${lesson.visual.points.map((pt) => `<li>${pt}</li>`).join("")}
                </ul>
              `
              : ""
          }
        </div>
        ${
          lesson.visual.sourceUrl
            ? `<p class="visual-card__source">${lang === "en" ? "Source" : "参照元"}: <a href="${lesson.visual.sourceUrl}" target="_blank" rel="noopener noreferrer">${lesson.visual.sourceUrl}</a></p>`
            : ""
        }
      </section>
    `
    : "";

  lessonCard.innerHTML = `
    <h2>${text.stepPrefix} ${current + 1}: ${lesson.topic}</h2>
    <p><strong>${text.estimateLabel}:</strong> ${text.approxPrefix}${lesson.minutes}${text.minutesUnit}</p>
    <p>${lesson.body}</p>
    <p>${lesson.detail}</p>
    ${visualHtml}
    ${lesson.glossary
      ? `
        <section class="mini-glossary" aria-label="${text.glossaryAria}">
          <p class="mini-glossary__title">${text.glossaryTitle}</p>
          <ul>
            ${lesson.glossary
              .map((item) => `<li><strong>${item.term}:</strong> ${item.description}</li>`)
              .join("")}
          </ul>
        </section>
      `
      : ""}
  `;

  const options = lesson.quiz.options
    .map((_, index) => `<div id="option-${index}"></div>`)
    .join("");

  quizCard.innerHTML = `
    <h3>${text.quizHeading}</h3>
    <p class="hint">${lesson.hint}</p>
    <p>${lesson.quiz.question}</p>
    <div class="option-list">${options}</div>
    <p id="feedback" class="feedback" hidden></p>
  `;

  lesson.quiz.options.forEach((text, index) => {
    const holder = quizCard.querySelector(`#option-${index}`);
    const button = optionTemplate.content.firstElementChild.cloneNode(true);
    button.textContent = `${index + 1}. ${text}`;
    button.addEventListener("click", () => chooseAnswer(index));
    holder.replaceWith(button);
  });

  if (answered) {
    renderAnsweredState(selectedAnswers[current]);
  }
}

function chooseAnswer(index) {
  const text = uiText[lang];
  const activeLessons = getLessons();
  if (answered) {
    return;
  }

  selectedAnswers[current] = index;
  answered = true;
  updateScore();
  scoreText.textContent = String(score);
  nextBtn.disabled = false;
  renderAnsweredState(index);

  if (current === activeLessons.length - 1) {
    nextBtn.textContent = text.viewResult;
  } else {
    nextBtn.textContent = text.next;
  }
}

function renderAnsweredState(index) {
  const text = uiText[lang];
  const lesson = getLessons()[current];
  const buttons = [...quizCard.querySelectorAll(".option-btn")];
  const feedback = quizCard.querySelector("#feedback");
  const correct = index === lesson.quiz.answerIndex;

  buttons.forEach((btn, i) => {
    btn.disabled = true;

    if (i === lesson.quiz.answerIndex) {
      btn.classList.add("correct");
    } else if (i === index) {
      btn.classList.add("wrong");
    }
  });

  if (correct) {
    feedback.textContent = `${text.correctPrefix} ${lesson.quiz.explanation}`;
    feedback.className = "feedback ok";
  } else {
    feedback.textContent = `${text.wrongPrefix} ${lesson.quiz.explanation}`;
    feedback.className = "feedback bad";
  }

  feedback.hidden = false;
}

function renderResult() {
  const text = uiText[lang];
  const activeLessons = getLessons();
  showingResult = true;
  const maxScore = activeLessons.length * 10;
  const rate = Math.round((score / maxScore) * 100);
  const totalMinutes = activeLessons.reduce((sum, item) => sum + item.minutes, 0);

  lessonCard.innerHTML = `
    <h2>${text.classDone}</h2>
    <p>${text.classDoneBody.replace("{total}", String(totalMinutes))}</p>
  `;

  quizCard.innerHTML = `
    <h3>${text.finalResult}</h3>
    <p>${text.yourScore}: <strong>${score} / ${maxScore}</strong> (${rate}%)</p>
    <p>${finalMessage(rate, lang)}</p>
  `;

  progressText.textContent = text.progressDone
    .replace("{current}", String(activeLessons.length))
    .replace("{total}", String(activeLessons.length));
  backBtn.textContent = text.back;
  restartBtn.textContent = text.restart;
  scoreUnit.textContent = text.scoreUnit;
  nextBtn.hidden = true;
  restartBtn.hidden = false;
  backBtn.disabled = current === 0;
}

function updateScore() {
  const activeLessons = getLessons();
  score = selectedAnswers.reduce((sum, answer, index) => {
    if (answer === activeLessons[index].quiz.answerIndex) {
      return sum + 10;
    }

    return sum;
  }, 0);
}

function finalMessage(rate, activeLang) {
  if (activeLang === "en") {
    if (rate === 100) {
      return "Excellent understanding of cloud fundamentals and AWS basics. Next, try a hands-on EC2 and S3 lab.";
    }

    if (rate >= 70) {
      return "Your foundation is solid. Review shared responsibility and IAM once more to align with real operations.";
    }

    return "You have the right foundation. Revisit core cloud concepts and major AWS services in order.";
  }

  if (rate === 100) {
    return "クラウド基礎とAWS入門の理解がとても高いです。次は実際にハンズオンでEC2とS3を触りましょう。";
  }

  if (rate >= 70) {
    return "基礎はしっかりしています。クラウドの責任分界とIAMをもう一度復習すると実務に近づきます。";
  }

  return "理解の土台はできています。もう一度、クラウドの基本概念とAWS主要サービスを順に復習しましょう。";
}

function getLessons() {
  return lang === "en" ? lessonsEn : lessons;
}

function updateStepSelectOptions() {
  const activeLessons = getLessons();
  const text = uiText[lang];
  stepSelect.innerHTML = activeLessons
    .map((item, index) => `<option value="${index}">${text.stepPrefix} ${index + 1}: ${item.topic}</option>`)
    .join("");
  stepSelect.value = String(current);
}

function applyLanguageUI() {
  const text = uiText[lang];
  document.documentElement.lang = lang;
  document.title = text.documentTitle;
  heroEyebrow.textContent = text.heroEyebrow;
  heroTitle.textContent = text.heroTitle;
  heroDescription.textContent = text.heroDescription;
  startBtn.textContent = text.start;
  progressPanel.setAttribute("aria-label", text.progressPanelAria);
  progressLabel.textContent = text.progressLabel;
  scoreLabel.textContent = text.scoreLabel;
  scoreUnit.textContent = text.scoreUnit;
  backBtn.textContent = text.back;
  restartBtn.textContent = text.restart;
  nextBtn.textContent = text.next;
  stepSelectLabel.textContent = text.stepSelectLabel;
  updateStepSelectOptions();
  langJaBtn.classList.toggle("is-active", lang === "ja");
  langEnBtn.classList.toggle("is-active", lang === "en");
}

function setLanguage(nextLang) {
  if (lang === nextLang) {
    return;
  }

  lang = nextLang;
  localStorage.setItem("awsLabLang", lang);
  applyLanguageUI();
  updateScore();

  if (app.hidden) {
    return;
  }

  if (showingResult) {
    renderResult();
  } else {
    render();
  }
}
</script>
  </body>
</html>
